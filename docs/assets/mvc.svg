<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" role="img" aria-labelledby="title desc">
  <title id="title">Model-View-Controller dependency rules</title>
  <desc id="desc">Controller may depend on Model and View. Model and View must not depend on each other or on Controller. Arrows show permitted dependencies.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#52647a"/>
    </marker>
  </defs>
  <rect width="800" height="414" rx="12" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="34" font-size="18" fill="#243247">Model-View-Controller boundaries</text>
    <g stroke="#52647a" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M350 258 V200 H180 V140"/>
      <path d="M450 258 V200 H620 V140"/>
    </g>
    <rect x="72" y="74" width="216" height="64" rx="8" fill="#dcf0e8" stroke="#4c9478"/>
    <rect x="512" y="74" width="216" height="64" rx="8" fill="#e3edf4" stroke="#638da5"/>
    <rect x="292" y="258" width="216" height="64" rx="8" fill="#e1e9f8" stroke="#6381ae"/>
    <g font-size="19" fill="#243247">
      <text x="180" y="112">Model</text>
      <text x="620" y="112">View</text>
      <text x="400" y="296">Controller</text>
    </g>
    <g font-size="13" fill="#8f3945">
      <text x="400" y="99">No direct</text>
      <text x="400" y="118">dependencies</text>
    </g>
    <text x="400" y="364" font-size="15" fill="#52647a">Arrows show permitted class dependencies</text>
    <text x="400" y="388" font-size="15" fill="#52647a">Model and View must not depend on Controller</text>
  </g>
</svg>
