<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">Isolated contexts with shared dependencies</title>
  <desc id="desc">Orders and Inventory each contain Domain, Application and Infrastructure. Both contexts may depend on SharedKernel and Integration Contracts. Contracts may depend on SharedKernel. Shared code cannot depend on contexts.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#52647a"/>
    </marker>
  </defs>
  <rect width="800" height="430" rx="12" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="34" font-size="18" fill="#243247">Context boundaries</text>
    <rect x="30" y="60" width="300" height="100" rx="8" fill="#e1e9f8" stroke="#6381ae"/>
    <rect x="470" y="60" width="300" height="100" rx="8" fill="#e1e9f8" stroke="#6381ae"/>
    <g fill="#243247">
      <text x="180" y="92" font-size="20">Orders</text>
      <text x="620" y="92" font-size="20">Inventory</text>
      <text x="180" y="122" font-size="14">Domain · Application · Infrastructure</text>
      <text x="620" y="122" font-size="14">Domain · Application · Infrastructure</text>
    </g>
    <text x="400" y="91" font-size="13" fill="#8f3945">No direct</text>
    <text x="400" y="110" font-size="13" fill="#8f3945">dependencies</text>
    <g stroke="#52647a" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M180 160 V238"/>
      <path d="M620 160 V238"/>
    </g>
    <rect x="30" y="240" width="740" height="112" rx="8" fill="#ffffff" stroke="#bac5d5"/>
    <text x="400" y="263" font-size="14" fill="#52647a">Both contexts may use either shared namespace</text>
    <rect x="50" y="281" width="260" height="52" rx="8" fill="#dcf0e8" stroke="#4c9478"/>
    <rect x="490" y="281" width="260" height="52" rx="8" fill="#e3edf4" stroke="#638da5"/>
    <path d="M490 307 H312" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
    <g font-size="19" fill="#243247">
      <text x="180" y="314">SharedKernel</text>
      <text x="620" y="314">Integration Contracts</text>
    </g>
    <text x="400" y="380" font-size="15" fill="#52647a">Arrows show permitted class dependencies</text>
    <text x="400" y="404" font-size="15" fill="#52647a">Shared code does not depend on context implementations</text>
  </g>
</svg>
